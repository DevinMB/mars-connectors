name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test connectors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - run: mvn -B verify

  security:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/security.yml

  # The Dependabot gate, after everything above passes: patch and minor updates
  # merge, then publish.yml runs on main (a merge made with GITHUB_TOKEN starts no
  # push workflow; dispatch is the documented exception). Majors get the
  # waits-for-you label and wait for a person.
  gate:
    needs: [build, security]
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      - name: Merge patch and minor updates, then build main
        if: steps.meta.outputs.update-type == 'version-update:semver-patch' || steps.meta.outputs.update-type == 'version-update:semver-minor'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          UPDATE: ${{ steps.meta.outputs.update-type }}
        run: |
          set -eu
          gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --merge --delete-branch
          gh workflow run publish.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo "### Merged #$PR ($UPDATE) and started the main build" >> "$GITHUB_STEP_SUMMARY"

      - name: Majors wait for you
        if: steps.meta.outputs.update-type == 'version-update:semver-major'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh label create waits-for-you --repo "$GITHUB_REPOSITORY" --color FBCA04 \
            --description "A major update: merge it after a look" 2>/dev/null || true
          gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --add-label waits-for-you
