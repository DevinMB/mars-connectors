name: Security

# Open-source scanners in place of GitHub Advanced Security, which private repos
# would need. Runs weekly too, because advisories are published against
# dependencies that have not changed.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secrets in git history
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: gitleaks
        run: >
          docker run --rm -v "$PWD:/repo:ro" zricethezav/gitleaks:v8.30.1
          git /repo --redact --no-banner --exit-code 1

  dependencies:
    name: Dependency vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      # Scans the built JARs rather than the POMs: the connectors are shaded, so
      # what ships to the Flink cluster is whatever ended up inside each JAR.
      - run: mvn -B -q package -DskipTests
      - name: Trivy
        run: >
          docker run --rm -v "$PWD:/src:ro" aquasec/trivy:0.75.0
          rootfs --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed
          --exit-code 1 --skip-dirs /src/.git /src
